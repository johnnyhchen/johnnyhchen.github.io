<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#f4f2eb">
    <title>{% if page.title and page.title != 'Home' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Johnny Chen home">
          <span class="brand-mark" aria-hidden="true">JC</span>
          <span class="brand-name">Johnny Chen<span class="brand-period">.</span></span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Writing</a>
          <a href="{{ '/archive/' | relative_url }}"{% if page.url contains '/archive' %} aria-current="page"{% endif %}>Archive</a>
          <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about' %} aria-current="page"{% endif %}>About</a>
        </nav>
      </header>

      <main id="main">
        {{ content }}
      </main>

      <footer class="site-footer">
        <p>Made slowly, by Johnny Chen.</p>
        <div class="footer-links">
          <a href="https://github.com/johnnyhchen">GitHub <span aria-hidden="true">↗</span></a>
          <a href="{{ '/feed.xml' | relative_url }}">RSS <span aria-hidden="true">↗</span></a>
        </div>
        <p class="copyright">© {{ 'now' | date: '%Y' }} Johnny Chen</p>
      </footer>
    </div>
  </body>
</html>
